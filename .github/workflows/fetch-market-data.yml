name: fetch-market-data
# Refresh of the raw data behind coreweave_analysis/ and popmart_analysis/ (Yahoo Finance, SEC, HKEXnews).
# Runs on a GitHub-hosted runner and commits the downloaded files back to the branch it was started on.
on:
  push:
    branches: [claude/ecstatic-pasteur-xjywhs]
    paths:
      - popmart_analysis/scripts/fetch_data.py
  workflow_dispatch:
    inputs:
      script:
        description: "Fetch script to run"
        default: popmart_analysis/scripts/fetch_data.py
        type: choice
        options: [coreweave_analysis/scripts/fetch_data.py, coreweave_analysis/scripts/fetch_extra.py, popmart_analysis/scripts/fetch_data.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas beautifulsoup4 lxml pdfminer.six
      - run: python ${{ inputs.script || 'popmart_analysis/scripts/fetch_data.py' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coreweave_analysis/data || true
          git add popmart_analysis/data || true
          git commit -m "Refresh raw data (${{ inputs.script || 'popmart_analysis/scripts/fetch_data.py' }})" || echo "nothing to commit"
          git push
