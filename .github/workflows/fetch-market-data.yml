name: fetch-market-data
on:
  push:
    branches: [claude/ecstatic-pasteur-xjywhs]
    paths:
      - .github/workflows/fetch-market-data.yml
      - coreweave_analysis/scripts/fetch_data.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas beautifulsoup4 lxml
      - run: python coreweave_analysis/scripts/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coreweave_analysis/data
          git commit -m "Add raw CRWV market data and SEC filings" || echo "nothing to commit"
          git push
