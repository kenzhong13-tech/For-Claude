name: fetch-market-data
# Refresh of the raw data behind coreweave_analysis/, popmart_analysis/, 3sbio_analysis/ and gdexpressway_analysis/
# (Yahoo Finance, SEC, HKEXnews, cninfo, Eastmoney via akshare, FRED).
# Runs on a GitHub-hosted runner and commits the downloaded files back to the branch it was started on.
on:
  push:
    branches: [claude/ecstatic-pasteur-xjywhs]
    paths:
      - gdexpressway_analysis/scripts/fetch_extra.py
  workflow_dispatch:
    inputs:
      script:
        description: "Fetch script to run"
        default: gdexpressway_analysis/scripts/fetch_data.py
        type: choice
        options: [coreweave_analysis/scripts/fetch_data.py, coreweave_analysis/scripts/fetch_extra.py, popmart_analysis/scripts/fetch_data.py,
                  3sbio_analysis/scripts/fetch_data.py, gdexpressway_analysis/scripts/fetch_data.py,
                  gdexpressway_analysis/scripts/fetch_extra.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install yfinance pandas beautifulsoup4 lxml pdfminer.six akshare
      - run: python ${{ inputs.script || 'gdexpressway_analysis/scripts/fetch_extra.py' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coreweave_analysis/data || true
          git add popmart_analysis/data || true
          git add 3sbio_analysis/data || true
          git add gdexpressway_analysis/data || true
          git commit -m "Refresh raw data (${{ inputs.script || 'gdexpressway_analysis/scripts/fetch_extra.py' }})" || echo "nothing to commit"
          git push
