name: fetch-market-data
# Downloads raw data for the *_analysis/ reports on a GitHub-hosted runner (open internet) and commits it back to the
# branch. Runs on its own when a push to a claude/ branch changes a *_analysis/scripts/fetch*.py file, or manually with
# a script path. Template from the stock-analysis-report skill.
on:
  push:
    branches: ["claude/**"]
    paths: ["*_analysis/scripts/fetch*.py"]
  workflow_dispatch:
    inputs:
      script:
        description: "Fetch script to run, e.g. acme_analysis/scripts/fetch_data.py"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install yfinance pandas beautifulsoup4 lxml pdfminer.six akshare
      - name: Run fetch scripts
        env:
          SCRIPT: ${{ inputs.script }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$SCRIPT" ]; then
            scripts="$SCRIPT"
          else
            # scripts changed by this push (a new branch has no "before" commit: compare with the parent)
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE=HEAD~1; fi
            scripts=$(git diff --name-only "$BEFORE" HEAD -- '*_analysis/scripts/fetch*.py' | grep -v '/fetch_template' || true)
          fi
          for s in $scripts; do
            if [ -f "$s" ]; then echo "::group::$s"; python "$s" || echo "::warning::$s exited with an error"; echo "::endgroup::"; fi
          done
      - name: Commit data
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a wildcard pathspec must match whole file paths, so add each existing data folder by name
          for d in *_analysis/data; do if [ -d "$d" ]; then git add -A -- "$d"; fi; done
          git commit -m "Refresh raw data (${SCRIPT:-changed fetch scripts})" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
